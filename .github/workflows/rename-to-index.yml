name: Rename to index.html

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename HTML file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv hanjra-trades-website-redesign.html index.html
          git commit -m "Rename hanjra-trades-website-redesign.html to index.html"
          git push
